# Test and build on every push and pull request; see docs/CI.md.
#
# Three jobs, and which of them exist is decided by repository variables, not
# by editing this file:
#
#   hosted      GitHub-hosted runner (or whatever CI_RUNS_ON names). Always on,
#               unless CI_HOSTED is set to the string "false".
#   self-hosted the build host's runner, label from CI_SELF_HOSTED_LABELS
#               (default `ghostty-dalamud`). Off unless CI_SELF_HOSTED is the
#               string "true". Stages from CI_SELF_HOSTED_STAGES, so a small
#               runner can be given `test` alone without editing this file.
#   ingame-dryrun  the in-game path against a stand-in for XivMcp and the game.
#               Costs seconds, needs no toolchain and no secret, and is the only
#               thing that keeps tools/ci/ingame.sh honest between the rare runs
#               that touch the real game.
#
# Fork safety. This is a public repository, so anyone can open a pull request,
# and a pull request can change this file. The self-hosted job must therefore be
# unreachable from a fork:
#
#   * the workflow has no `pull_request_target` trigger and no secret, so a
#     fork's pull request runs with a read-only token and its own fork context;
#   * the self-hosted job's `if` requires the pull request's head repository to
#     be this repository, and that the repository is not a fork;
#   * the runner labels are not GitHub's, so a fork of this repository has no
#     runner to land on even if it edits this file;
#   * and Settings -> Actions -> "require approval for all external
#     contributors" means a fork's first-ever run waits for a human.
#
# A fork pull request still runs the `hosted` job, on GitHub's runners, which is
# the point of CI on a public repository.
name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # CHANGELOG.md is generated from lua/changelog.lua (the changelog players read
  # in Settings); this fails when the two disagree. Seconds, no toolchain, so it
  # answers before the build does. tools/ci/run.sh test runs the same check.
  # Note: the paths-ignore above means an edit to CHANGELOG.md *alone* starts no
  # run at all; the check catches drift on the next push that touches code.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: CHANGELOG.md matches lua/changelog.lua
        run: python3 tools/changelog.py --check

  # Fast feedback that needs no toolchain: the Python suites that guard
  # portability and the identity-rewrite tooling.
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  # A branch of this repository is already built by its push; only pull requests
  # from forks need a run of their own.
  hosted:
    if: >-
      ${{ vars.CI_HOSTED != 'false'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name != github.repository) }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-test.yml
    with:
      runs_on: ${{ vars.CI_RUNS_ON || '"ubuntu-latest"' }}
      artifact: ghostty-dalamud-${{ github.sha }}
      cache: true
      stages: test build

  # The build host. Never a fork, never a fork's pull request: see the header.
  self-hosted:
    if: >-
      ${{ vars.CI_SELF_HOSTED == 'true'
          && !github.event.repository.fork
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-test.yml
    with:
      # a JSON array of labels; the runner carries self-hosted, Linux and X64
      runs_on: >-
        ${{ vars.CI_SELF_HOSTED_RUNS_ON
            || format('["self-hosted","Linux","X64",{0}]', toJSON(vars.CI_SELF_HOSTED_LABELS || 'ghostty-dalamud')) }}
      # the container keeps its own warm cache volume; the Actions cache would
      # only duplicate it, and a self-hosted run has no minutes to save
      cache: false
      artifact: ''
      # The dispatched container is small (2 CPUs, 4 GB by default). If a full
      # build does not fit, set CI_SELF_HOSTED_STAGES to `test` and let the
      # hosted job do the building. docs/CI.md.
      stages: ${{ vars.CI_SELF_HOSTED_STAGES || 'test build' }}
      timeout: ${{ fromJSON(vars.CI_SELF_HOSTED_TIMEOUT || '120') }}

  # The in-game path without the game: tools/ci/mock-xivmcp.py stands in for
  # XivMcp, the loader and `/term selftest`, and every exit status ingame.sh can
  # produce is checked. No secret, no network, no build.
  ingame-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: In-game dry run (mock XivMcp)
        run: tools/ci/run.sh ingame-dryrun
