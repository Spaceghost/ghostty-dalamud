name: Approved privacy and portability maintenance
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'Spaceghost/ghostty-dalamud' && contains(github.event.head_commit.message, '[apply-maintenance]')
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      head: ${{ steps.repair.outputs.head }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply repairs and atomically preserve all branch histories
        id: repair
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/ghostty-maintenance-refs-$GITHUB_RUN_ID"
          git ls-remote --heads --tags origin > "$snapshot"
          [[ "$(awk '$2 == "refs/heads/main" {print $1}' "$snapshot")" == "$EXPECTED_HEAD" ]]
          if grep -q 'refs/tags/' "$snapshot"; then
            echo 'Unexpected tags: manual review required before rewriting.' >&2
            exit 1
          fi
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git switch -C main "$EXPECTED_HEAD"
          python3 tools/maintenance/apply_repairs.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          text = p.read_text()
          assert text.count('on: [workflow_dispatch]') == 1
          p.write_text(text.replace('on: [workflow_dispatch]', 'on: [push, pull_request, workflow_dispatch]'))
          p = Path('.gitignore')
          p.write_text(p.read_text() + '\n# Python maintenance/test caches\n__pycache__/\n*.py[cod]\n')
          PY
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check
          publisher="$RUNNER_TEMP/ghostty-publish-$GITHUB_RUN_ID.py"
          cp tools/maintenance/publish_all.py "$publisher"
          rm .github/workflows/maintenance.yml tools/maintenance/apply_repairs.py tools/maintenance/publish_all.py
          git add -A
          git -c user.name=Spaceghost -c user.email=251370+Spaceghost@users.noreply.github.com commit -m 'Repair fresh installs, isolate native cache and clarify release readiness'
          python3 "$publisher" "$snapshot"
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check
          rm -f "$publisher" "$snapshot"
  clean-linux-build:
    needs: repair
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.repair.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned Zig from the official distribution
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, tarfile, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ghostty-zig'
          root.mkdir(parents=True, exist_ok=True)
          version = next(line.split('=', 1)[1].strip() for line in pathlib.Path('toolchain.env').read_text().splitlines() if line.startswith('ZIG_VERSION='))
          with urllib.request.urlopen('https://ziglang.org/download/index.json', timeout=60) as response:
              release = json.load(response)[version]['x86_64-linux']
          assert release['tarball'].startswith('https://ziglang.org/'), 'unexpected toolchain origin'
          archive = root / 'zig.tar.xz'
          with urllib.request.urlopen(release['tarball'], timeout=120) as response, archive.open('wb') as output:
              shutil.copyfileobj(response, output)
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == release['shasum'], 'toolchain checksum mismatch'
          with tarfile.open(archive) as tar:
              tar.extractall(root, filter='data')
          binaries = list(root.glob('*/zig'))
          assert len(binaries) == 1, 'unexpected toolchain layout'
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(binaries[0].parent) + '\n')
          PY
      - run: tools/fetch-vendor.sh
      - run: tools/build.sh
      - run: vendor/nelua-lang/nelua-lua tests/test_defaults.lua
      - run: tests/run.sh
