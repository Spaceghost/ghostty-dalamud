name: Plugin candidate
on:
  pull_request:
  push:
    branches: [main, release/dalamud-submission-prep]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packaging-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_release.py' -v
      - run: for script in tools/*.sh tests/run.sh; do bash -n "$script"; done
  candidate:
    needs: packaging-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      SKIP_UMBRA: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the selected Zig version, checking its upstream checksum
        shell: bash
        run: |
          source toolchain.env
          export ZIG_VERSION
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile, urllib.request
          with urllib.request.urlopen('https://ziglang.org/download/index.json', timeout=60) as response:
              index = json.load(response)
          selected = index[os.environ['ZIG_VERSION']]['x86_64-linux']
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zig'
          destination.mkdir()
          archive = destination / 'zig.tar.xz'
          with urllib.request.urlopen(selected['tarball'], timeout=120) as response:
              archive.write_bytes(response.read())
          if hashlib.sha256(archive.read_bytes()).hexdigest() != selected['shasum']:
              raise SystemExit('Zig archive checksum mismatch')
          with tarfile.open(archive) as bundle:
              bundle.extractall(destination, filter='data')
          executable = next(destination.glob('*/zig'))
          with open(os.environ['GITHUB_PATH'], 'a') as stream:
              stream.write(str(executable.parent) + '\n')
          PY
      - name: Build and validate private candidate
        run: tools/build-release.sh
      - name: Existing native and agent tests
        run: tests/run.sh
      - name: Retain candidate and restore evidence (not a public release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GhosttyDalamud-candidate-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/release/
            shim/GhosttyDalamud/packages.lock.json
