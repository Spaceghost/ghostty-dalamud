# The quality gate on every push and pull request to master: lint, secret scan,
# sanitizers, static analysis. Each check is one matrix row, writes a row in the
# job summary, keeps one issue (label quality-<kind>) up to date on master, and
# uploads its logs. GitHub-hosted runners, no secrets beyond the job token; a
# pull request never touches issues. The slow checks run in quality-nightly.yml
# and quality-deep.yml. See docs/QUALITY.md.
name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: lint
            run: 'tools/ci/run.sh lint'
          - kind: secrets
            run: 'gitleaks git --redact --no-banner .'
            history: true
          - kind: asan
            run: 'SAN=asan tools/ci/run.sh test'
          - kind: ubsan
            run: 'SAN=ubsan tools/ci/run.sh test'
          - kind: static
            run: 'tools/ci/in-fedora.sh tools/ci/run.sh static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: ${{ matrix.history && '0' || '1' }}
      - name: Install the tools the checks use
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck lua-check valgrind clang
          tools/ci/fetch-tool.sh actionlint
          tools/ci/fetch-tool.sh gitleaks
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: Cache toolchains and vendor checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ghostty-dalamud-ci
            vendor
          key: toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.env') }}
      - name: ${{ matrix.kind }}
        id: check
        env:
          CHECK: ${{ matrix.run }}
        run: |
          mkdir -p build
          set -o pipefail
          bash -c "$CHECK" 2>&1 | tee "build/check-${{ matrix.kind }}.log"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/report-issue.sh "${{ matrix.kind }}" "${{ steps.check.outcome == 'success' && 'pass' || 'fail' }}" "build/check-${{ matrix.kind }}.log"
      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.kind }}-${{ github.run_id }}
          path: |
            build/check-*.log
            build/*.log
            build/static
            build/fuzz
            build/massif
          if-no-files-found: ignore
