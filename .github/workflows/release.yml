# On a v* tag pushed by tools/release.sh: test, build and package on a GitHub-hosted
# runner, then publish the GitHub Release the plugin repository listing points at.
#
#   v0.3.0          stable. .../releases/latest/download/latest.zip and pluginmaster.json
#                   are what spacegho.st/mods/ffxiv/plugins.json serves; the names never
#                   change, so neither do the URLs.
#   v0.3.1-test.1   testing. A prerelease under its own tag, and copied onto the floating
#                   `testing` prerelease, so .../releases/download/testing/latest.zip is
#                   always the newest test build. It never touches a stable release.
#
# The testing channel also fills itself: after CI is green on a master commit,
# testing-channel.yml cuts the next test tag with `tools/releasekit.py auto-test` and calls
# this workflow for it (a tag pushed with the workflow token starts no workflow on its own).
# workflow_dispatch publishes an existing tag again, for when a run failed part way.
#
# The job refuses a fork, a tag that is not on master (or, for a test build, not a
# version-only commit on top of master), and a tag that does not name the version in the
# manifest. Notes come from the changelog and the merged history; see docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: the release tag to build and publish, already pushed
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: the release tag to build and publish again (vX.Y.Z or vX.Y.Z-test.N)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # never from a fork, and only on GitHub's own runners
    if: github.repository == 'Spaceghost/ghostty-dalamud'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # the tag this run publishes, whichever way it was started
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0 # check-tag looks for the tag's commit on master, and at older tags
          persist-credentials: false

      - name: Check the tag against the manifest, the changelog and master
        run: tools/releasekit.py check-tag "$TAG"

      - name: Probe for the .NET SDK
        id: dotnet
        run: |
          if command -v dotnet >/dev/null && dotnet --list-sdks | grep -q '^10\.'; then
            echo "have=true" >>"$GITHUB_OUTPUT"
          else
            echo "have=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Install the .NET SDK
        if: steps.dotnet.outputs.have != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # restore only: release runs never write caches
      - name: Restore toolchains and vendor checkouts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ghostty-dalamud-ci
            vendor
          key: toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.env') }}
      - name: Restore Zig build caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig-global
            build/zig-cache-linux
            build/zig-cache-win
          key: zig-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.env') }}

      - name: Test, build and package
        env:
          RELEASE_TAG: ${{ env.TAG }}
          # a tag with a pre-release part (v0.2.1-test.1) is a testing build, and
          # tools/package.sh writes pluginmaster-testing.json instead
          TESTING: ${{ contains(env.TAG, '-') && '1' || '0' }}
        run: tools/ci/run.sh all

      - name: Build the Linux agent packages in a Fedora 44 container
        env:
          IN_FEDORA_PKGS: 'gcc make git rust cargo binutils rpm-build systemd-rpm-macros pkgconf-pkg-config wlroots-devel wayland-devel wayland-protocols-devel libxkbcommon-devel pixman-devel tar gzip cpio diffutils findutils which'
          RELEASE_TAG: ${{ env.TAG }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          HOST_UID=$(id -u) HOST_GID=$(id -g) \
          tools/ci/in-fedora.sh tools/ci/agent-rpm.sh --out build/release

      - name: Build the Alpine agent package in an Alpine container
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e HOME=/tmp/home \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            alpine:edge sh -ec '
              mkdir -p "$HOME"
              apk add --no-cache alpine-sdk git findutils tar >/dev/null
              git config --global --add safe.directory "*"
              tools/ci/agent-apk.sh --out build/release'

      - name: Check the release files, and write SHA256SUMS
        run: |
          set -euo pipefail
          cd build/release
          for f in latest.zip ${{ contains(env.TAG, '-') && 'pluginmaster-testing.json' || 'pluginmaster.json' }}; do
            [[ -s "$f" ]] || { echo "::error::build/release/$f is missing"; exit 1; }
          done
          for g in 'ghostty-agent-*-src.tar.gz' 'ghostty-agent-src.tar.gz' \
                   'ghostty-agent-*-linux-x86_64.tar.gz' 'ghostty-agent-linux-x86_64.tar.gz' \
                   'ghostty-agent-*-windows-x64.zip' \
                   'ghostty-agent-*-1.fc44.x86_64.rpm' 'ghostty-agent.fc44.x86_64.rpm' \
                   'ghostty-agent-*-1.fc43.x86_64.rpm' 'ghostty-agent.fc43.x86_64.rpm' \
                   'ghostty-agent-*-r0.apk' 'ghostty-agent.apk'; do
            compgen -G "$g" >/dev/null || { echo "::error::build/release/$g is missing"; exit 1; }
          done
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' pluginmaster*.json
          rm -f SHA256SUMS
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          tools/releasekit.py notes "$TAG" --assets build/release >"$RUNNER_TEMP/notes.md"
          tools/releasekit.py title "$TAG" >"$RUNNER_TEMP/title.txt"

      - name: Publish the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="$(cat "$RUNNER_TEMP/title.txt")"
          kind=(--latest)
          [[ "$TAG" == *-* ]] && kind=(--prerelease --latest=false)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/release/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" build/release/* --verify-tag --title "$title" \
              --notes-file "$RUNNER_TEMP/notes.md" "${kind[@]}"
          fi

      # The testing channel is one floating prerelease called `testing`, so the listing can
      # name a download URL that never changes. It is a mailbox for the newest test build:
      # its notes say which tag and commit that is. A stable tag never runs this step, and
      # this step never touches a stable release.
      - name: Put this build on the testing channel
        if: contains(env.TAG, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # the tag's own commit: when this workflow is called, github.sha is the caller's
          SHA="$(git rev-parse HEAD)"
          title="$(sed 's/ v[0-9].*//' "$RUNNER_TEMP/title.txt") testing channel"
          {
            printf '> [!NOTE]\n> **The rolling testing channel.** It always carries the newest test build: now [%s](https://github.com/%s/releases/tag/%s), commit %s.\n\n' \
              "$TAG" "$GH_REPO" "$TAG" "${SHA:0:7}"
            cat "$RUNNER_TEMP/notes.md"
          } >"$RUNNER_TEMP/testing.md"
          if gh release view testing >/dev/null 2>&1; then
            # Moving the tag is a courtesy; the token may not be allowed to, and the
            # notes name the real tag and commit either way.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/testing" -f sha="$SHA" -F force=true >/dev/null ||
              echo "::warning::could not move the testing tag; its release notes name $TAG"
            gh release upload testing build/release/* --clobber
            # older builds' versioned zips: gone only once the new files are in place
            gh release view testing --json assets -q '.assets[].name' | while read -r old; do
              [[ -e "build/release/$old" ]] || gh release delete-asset testing "$old" --yes
            done
            gh release edit testing --prerelease --latest=false --title "$title" --notes-file "$RUNNER_TEMP/testing.md"
          else
            gh release create testing build/release/* --target "$SHA" --prerelease --latest=false \
              --title "$title" --notes-file "$RUNNER_TEMP/testing.md"
          fi

      - name: Upload build/release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostty-dalamud-${{ env.TAG }}
          path: build/release
          if-no-files-found: error
          retention-days: 30
