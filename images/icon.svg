<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Ghostty for FFXIV</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1f3564"/>
      <stop offset="0.55" stop-color="#0f1c3b"/>
      <stop offset="1" stop-color="#060b1a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a4"/>
      <stop offset="0.5" stop-color="#c99a4b"/>
      <stop offset="1" stop-color="#8a6128"/>
    </linearGradient>
    <linearGradient id="crystalL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bff4ff"/>
      <stop offset="1" stop-color="#2c8fd6"/>
    </linearGradient>
    <linearGradient id="crystalR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc8f5"/>
      <stop offset="1" stop-color="#16508f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fdcff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fdcff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dcefff"/>
      <stop offset="1" stop-color="#a9cdef"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2f5c"/>
      <stop offset="1" stop-color="#0a1430"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="512" height="512" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- stars -->
    <g fill="#cfe8ff">
      <circle cx="84" cy="96" r="3"/><circle cx="132" cy="62" r="2"/><circle cx="420" cy="84" r="2.5"/>
      <circle cx="444" cy="170" r="2"/><circle cx="70" cy="200" r="2"/><circle cx="392" cy="44" r="1.8"/>
    </g>
    <!-- aetheryte: floating crystal with its gold ring -->
    <circle cx="256" cy="118" r="120" fill="url(#halo)"/>
    <path d="M86 128 A170 30 0 0 1 426 128" fill="none" stroke="url(#gold)" stroke-width="9" opacity="0.9"/>
    <g filter="url(#glow)">
      <path d="M256 34 L298 104 L256 166 Z" fill="url(#crystalR)"/>
      <path d="M256 34 L214 104 L256 166 Z" fill="url(#crystalL)"/>
      <path d="M256 34 L236 104 L256 166 L276 104 Z" fill="#e9fbff" opacity="0.4"/>
      <path d="M212 112 L256 124 L298 104" fill="none" stroke="#e9fbff" stroke-opacity="0.6" stroke-width="2"/>
    </g>
    <path d="M86 128 A170 30 0 0 0 426 128" fill="none" stroke="url(#gold)" stroke-width="9"/>
    <!-- ghost -->
    <g transform="translate(256 0) scale(0.92) translate(-256 0) translate(0 -6)">
      <path d="M136 314 A120 120 0 0 1 376 314 L376 452 L136 452 Z" fill="#7fdcff" opacity="0.35" filter="url(#soft)"/>
      <path d="M136 314 A120 120 0 0 1 376 314 L376 432
               Q376 458 352 450 Q332 442 316 458 Q296 476 276 456 Q256 440 236 456 Q216 476 196 458 Q180 442 160 450 Q136 458 136 432 Z"
            fill="url(#ghost)" stroke="#ffffff" stroke-width="4"/>
      <rect x="164" y="284" width="184" height="124" rx="26" fill="url(#screen)" stroke="#6fd6ff" stroke-width="5"/>
      <path d="M176 298 Q256 288 336 298 L336 330 Q256 320 176 330 Z" fill="url(#glare)"/>
      <g filter="url(#glow)" stroke="#8ff0ff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M200 316 L238 346 L200 376"/>
        <path d="M260 378 L308 378"/>
      </g>
    </g>
    <!-- gold trim -->
    <rect x="12" y="12" width="488" height="488" rx="94" fill="none" stroke="url(#gold)" stroke-width="8"/>
    <rect x="26" y="26" width="460" height="460" rx="82" fill="none" stroke="#c99a4b" stroke-opacity="0.45" stroke-width="2"/>
  </g>
</svg>
