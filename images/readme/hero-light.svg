<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>Ghostty for FFXIV: Eorzea is a terminal multiplexer</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f0fb"/><stop offset="0.55" stop-color="#f7eedb"/><stop offset="1" stop-color="#f5d9ac"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9dcf2"/><stop offset="1" stop-color="#8fb0dc"/></linearGradient>
    <radialGradient id="horizon" cx="72%" cy="100%" r="60%"><stop offset="0" stop-color="#ffcf7a" stop-opacity="0.75"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8fe3ff" stop-opacity="0.6"/>
      <stop offset="0.4" stop-color="#4fb0f0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4fb0f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c99a4b"/><stop offset="0.5" stop-color="#94682c"/><stop offset="1" stop-color="#5a3d14"/></linearGradient>
    <linearGradient id="goldH" gradientUnits="userSpaceOnUse" x1="84" y1="0" x2="500" y2="0">
      <stop offset="0" stop-color="#d6a854" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#d6a854"/>
      <stop offset="0.85" stop-color="#d6a854"/>
      <stop offset="1" stop-color="#d6a854" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9f6ff"/>
      <stop offset="1" stop-color="#2a8bd3"/>
    </linearGradient>
    <linearGradient id="cR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63cdf7"/>
      <stop offset="1" stop-color="#134a88"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3a70" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#071230" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a9cdef"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe3ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8fe3ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
    <!-- one curved glass terminal, 300 x 180, drawn at the origin -->
    <g id="screen">
      <path d="M0 10 Q150 -8 300 10 L300 170 Q150 188 0 170 Z" fill="url(#glass)" stroke="#6fd6ff" stroke-width="3"/>
      <path d="M8 18 Q150 2 292 18 L292 60 Q150 46 8 60 Z" fill="url(#glare)"/>
      <circle cx="18" cy="22" r="4" fill="#d6a854"/><circle cx="32" cy="21" r="4" fill="#6fd6ff" opacity="0.7"/>
    </g>
  </defs>

