  <rect y="300" width="1280" height="160" fill="url(#horizon)"/>
  <!-- sea -->
  <rect y="458" width="1280" height="182" fill="url(#sea)"/>
  <path d="M0 458 L1280 458" stroke="#5f8fc8" stroke-opacity="0.6" stroke-width="2"/>
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.7">
    <path d="M140 500 h120 M320 530 h80 M60 560 h160 M420 590 h110 M250 612 h60" stroke-width="2"/>
  </g>

  <!-- aetheryte -->
  <circle cx="990" cy="290" r="220" fill="url(#halo)"/>
  <ellipse cx="990" cy="600" rx="36" ry="170" fill="url(#refl)" filter="url(#blur)"/>
  <g stroke="#9fe6ff" stroke-linecap="round" opacity="0.5">
    <path d="M950 488 h80 M930 516 h120 M962 548 h56 M940 580 h100" stroke-width="3"/>
  </g>
  <path d="M870 300 A120 26 0 0 1 1110 300" fill="none" stroke="url(#gold)" stroke-width="7" opacity="0.85"/>
  <path d="M900 214 A90 18 0 0 1 1080 214" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.7"/>
  <g filter="url(#bigglow)">
    <path d="M990 110 L1044 270 L990 420 Z" fill="url(#cR)"/>
    <path d="M990 110 L936 270 L990 420 Z" fill="url(#cL)"/>
    <path d="M990 110 L966 256 L990 420 L1014 256 Z" fill="#effcff" opacity="0.35"/>
    <path d="M936 270 L990 288 L1044 270" fill="none" stroke="#effcff" stroke-opacity="0.6" stroke-width="2"/>
  </g>
  <path d="M870 300 A120 26 0 0 0 1110 300" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <path d="M900 214 A90 18 0 0 0 1080 214" fill="none" stroke="url(#gold)" stroke-width="4"/>

  <!-- floating terminals -->
  <g font-family="'Fira Code','Source Code Pro','DejaVu Sans Mono',monospace" font-size="15">
    <!-- main screen, left of the crystal -->
    <g transform="translate(600 150) rotate(-4)" filter="url(#glow)">
      <use href="#screen"/>
      <text x="16" y="62" fill="#8ff0ff">~ $ /term</text>
      <text x="16" y="86" fill="#cfe4ff">ghostty-agent: connected</text>
      <text x="16" y="110" fill="#d6a854">~ $ <tspan fill="#cfe4ff">ls ~/limsa</tspan></text>
      <text x="16" y="134" fill="#9fb8e0">docks/  aftcastle/  notes.md</text>
      <text x="16" y="158" fill="#8ff0ff">~ $ <tspan fill="#8ff0ff">▌</tspan></text>
    </g>
    <!-- upper right screen -->
    <g transform="translate(1072 96) scale(0.62) rotate(5)" filter="url(#glow)">
      <use href="#screen"/>
      <text x="16" y="70" fill="#8ff0ff" font-size="22">$ htop</text>
      <rect x="16" y="92" width="200" height="12" rx="3" fill="#6fd6ff" opacity="0.8"/>
      <rect x="16" y="114" width="140" height="12" rx="3" fill="#d6a854" opacity="0.8"/>
      <rect x="16" y="136" width="230" height="12" rx="3" fill="#6fd6ff" opacity="0.5"/>
    </g>
    <!-- lower right screen -->
    <g transform="translate(1064 318) scale(0.55) rotate(-3)" filter="url(#glow)">
      <use href="#screen"/>
      <text x="16" y="72" fill="#d6a854" font-size="24">$ nvim</text>
      <rect x="16" y="94" width="120" height="12" rx="3" fill="#9fb8e0" opacity="0.7"/>
      <rect x="40" y="116" width="180" height="12" rx="3" fill="#8ff0ff" opacity="0.7"/>
      <rect x="40" y="138" width="90" height="12" rx="3" fill="#9fb8e0" opacity="0.5"/>
    </g>
  </g>
  <!-- screen reflections -->
  <path d="M600 480 h300" stroke="#6fd6ff" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round" filter="url(#blur)"/>

  <!-- the ghost, floating beside its terminal -->
  <ellipse cx="652" cy="520" rx="34" ry="46" fill="url(#refl)" filter="url(#blur)" opacity="0.8"/>
  <g transform="translate(560 262) scale(0.36)">
    <path d="M136 314 A120 120 0 0 1 376 314 L376 432
             Q376 458 352 450 Q332 442 316 458 Q296 476 276 456 Q256 440 236 456 Q216 476 196 458 Q180 442 160 450 Q136 458 136 432 Z"
          fill="url(#ghost)" stroke="#ffffff" stroke-width="5" filter="url(#glow)"/>
    <ellipse cx="220" cy="320" rx="16" ry="22" fill="#0e1d45"/>
    <ellipse cx="292" cy="320" rx="16" ry="22" fill="#0e1d45"/>
    <circle cx="226" cy="312" r="5" fill="#ffffff"/><circle cx="298" cy="312" r="5" fill="#ffffff"/>
    <path d="M238 366 Q256 380 274 366" fill="none" stroke="#0e1d45" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- title block -->
  <g font-family="'Noto Serif','STIX Two Text',Georgia,serif">
    <text x="84" y="250" font-size="104" font-weight="700" fill="url(#gold)" letter-spacing="1">Ghostty</text>
    <text x="90" y="318" font-size="50" font-weight="600" fill="#3d2f14" letter-spacing="6">for FFXIV</text>
  </g>
  <path d="M84 352 H500" stroke="url(#goldH)" stroke-width="2"/>
  <path d="M292 344 l8 8 l-8 8 l-8 -8 Z" fill="#d6a854"/>
  <text x="86" y="398" font-family="'Fira Code','Source Code Pro','DejaVu Sans Mono',monospace" font-size="22" fill="#17577d">&gt; Eorzea is a terminal multiplexer<tspan fill="#8ff0ff">▌</tspan></text>

  <!-- gold frame -->
  <rect x="14" y="14" width="1252" height="612" rx="18" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>
</svg>
