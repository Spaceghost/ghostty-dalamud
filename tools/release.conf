# What tools/release.sh and tools/releasekit.py need to know about this repository.
# KEY=value, one per line; lists are space separated (CI_WORKFLOWS: comma separated).
NAME=Ghostty
INTERNAL_NAME=GhosttyDalamud
REPO=Spaceghost/ghostty-dalamud
MANIFEST=shim/GhosttyDalamud/GhosttyDalamud.json
# files that carry the four-part version (X.Y.Z.N), and the three-part one (X.Y.Z)
VERSION_FILES=shim/GhosttyDalamud/GhosttyDalamud.json shim/GhosttyDalamud/GhosttyDalamud.csproj packaging/ghostty-agent.spec
BASE_VERSION_FILES=core/buildinfo.nelua
CHANGELOG_TOOL=tools/changelog.py
CHANGELOG_FILES=lua/changelog.lua CHANGELOG.md
BANNER=images/banner.png
SITE=https://spacegho.st/mods/ffxiv/term/
# workflows that must be green on the commit being released
# the host-side helper this mod ships, if any: the release checks for its
# packages and the notes tell players how to install it. Mods without one
# leave this out.
AGENT=ghostty-agent
CI_WORKFLOWS=CI
